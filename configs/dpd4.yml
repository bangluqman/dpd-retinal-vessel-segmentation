architecture: unet_dpd_all4_ablation
class_name: DPDAllStagesUNet
role: deeper/all-four-stage placement ablation
base_channels: 64
adapter_locations: [reduction_1, reduction_2, reduction_3, reduction_4]
standard_max_pool_path_retained: true
pixel_unshuffle_factor: 2
projection: "bias-free 1x1 Conv(4Cin -> Cout), BatchNorm"
residual_behavior: projected phase features are added to standard post-DoubleConv features, followed by ReLU
initialization: BatchNorm affine weight and bias are zero

